name: Test Bybit announcements geo-block

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Bybit market data API (known geo-blocked per README)
        run: |
          curl -sS -o /dev/null -w "api.bybit.com/v5/market/tickers -> HTTP %{http_code}\n" \
            "https://api.bybit.com/v5/market/tickers?category=spot" || true

      - name: Curl Bybit announcements API (the one we want to use)
        run: |
          curl -sS -o /tmp/resp.json -w "api.bybit.com/v5/announcements/index -> HTTP %{http_code}\n" \
            "https://api.bybit.com/v5/announcements/index?locale=en-US&limit=3" || true
          echo "--- response body (first 500 chars) ---"
          head -c 500 /tmp/resp.json || true
